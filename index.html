<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Binho IA – Assistente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="chat-wrapper">

    <header class="chat-header">
      <div class="avatar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18.01"/>
        </svg>
      </div>
      <div class="header-info">
        <span class="header-name">BINHO IA</span>
        <span class="header-status"><span class="dot"></span>ONLINE AGORA</span>
      </div>
      <div class="header-tag">v2.0</div>
    </header>

    <main class="chat-messages" id="chatMessages">
      <div class="date-divider">HOJE</div>
      <div class="message bot">
        <div class="msg-avatar">BI</div>
        <div class="bubble">
          Olá! Sou o <strong>Binho IA</strong>, assistente da <strong>Binho Celulares</strong>. 📱<br/>
          Me pergunte sobre preços, modelos, memória, cores e muito mais!
        </div>
      </div>
    </main>

    <footer class="chat-footer">
      <input
        type="text"
        id="userInput"
        placeholder="Qual celular você procura?"
        autocomplete="off"
      />
      <button id="sendBtn" onclick="sendMessage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </footer>

  </div>

  <script src="chat.js"></script>
</body>
</html>
